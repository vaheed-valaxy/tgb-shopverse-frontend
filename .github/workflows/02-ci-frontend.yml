# =======================================================================================
# CI/CD — Frontend
#
# Flow:
#
# Push to develop/release
#        │
#        ▼
#   _go-build.yml
#        │
#        ├── Gitleaks
#        ├── ESLint
#        ├── Trivy FS
#        ├── Dockerfile scans
#        ├── Build image
#        ├── Trivy image scan
#        ├── Push image → ECR
#        ├── Cosign signing
#        ├── SBOM generation + attestation
#        └── Update GitOps Helm values + create PR
#
# GitOps PR:
#        │
#        ▼
#   GitOps repository
#        │
#        ├── Helm lint
#        ├── Helm template
#        ├── Kubeconform
#        └── Trivy config scan
#        │
#        ▼
#      Merge
#        │
#        ▼
#      Argo CD
#
# =======================================================================================

name: CI/CD — Frontend

on:
  workflow_dispatch: 
  push:
    branches:
      - develop
      - 'release/**'

    # paths:
    #   - 'frontend/**'
    #   - '.github/workflows/02-ci-frontend.yml'
    #   - '.github/workflows/_node-build.yml'
    #   - '.github/workflows/_node-code-scan.yml'
    #   # - '.github/workflows/_reusable-*.yml'

# =======================================================================================
# Permissions
# =======================================================================================

permissions:
  contents: read
  id-token: write
  security-events: write
  actions: read

# =======================================================================================
# Environment
# =======================================================================================

env:
  RUNS_ON: shopverse-frontend-runners                      # ubuntu-latest
  ECR_REPOSITORY: "shopverse-dev/frontend"
  
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_REGION: us-east-1

  GITOPS_OWNER: ${{ vars.GITOPS_OWNER }}
  GITOPS_REPO: ${{ vars.GITOPS_REPO }}

  # AWS_ECR_ROLE_ARN: ${{ vars.AWS_ECR_ROLE_ARN }}

# =======================================================================================
# Jobs
# =======================================================================================

jobs:

  # =============================================================================
  # 1. Prepare AWS / Application Parameters
  # =============================================================================

  Set-Variables-Job:
    name: Set Variables
    runs-on: ubuntu-latest

    outputs:
      runner: ${{ steps.set-variables.outputs.runner }}
      ecr-registry: ${{ steps.set-variables.outputs.ecr-registry }}
      ecr-repository: ${{ steps.set-variables.outputs.ecr-repository }}
      aws-region: ${{ steps.set-variables.outputs.aws-region }}
      aws-ecr-role-arn: ${{ steps.set-variables.outputs.aws-ecr-role-arn }}

    steps:
      - name: Show GitHub Repository IDs
        run: |
          echo "Repository       : ${{ github.repository }}"
          echo "Repository Owner : ${{ github.repository_owner }}"
          echo "Owner ID         : ${{ github.repository_owner_id }}"
          echo "Repository ID    : ${{ github.repository_id }}"
          
      - name: Set Variables
        id: set-variables
        env:
          # AWS_ECR_ROLE_ARN: ${{ runner.environment == 'github-hosted' && vars.AWS_ECR_ROLE_ARN || '' }}
          AWS_ECR_ROLE_ARN: ${{ env.RUNS_ON == 'ubuntu-latest' && vars.AWS_ECR_ROLE_ARN || '' }}
          ECR_REGISTRY: "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
        run: |
          echo "runner=$RUNS_ON" >> "$GITHUB_OUTPUT"
          echo "ecr-registry=$ECR_REGISTRY" >> "$GITHUB_OUTPUT"
          echo "ecr-repository=$ECR_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "aws-region=$AWS_REGION" >> "$GITHUB_OUTPUT"
          echo "aws-ecr-role-arn=$AWS_ECR_ROLE_ARN" >> "$GITHUB_OUTPUT"

          echo "RUNNER         : $RUNS_ON"
          echo "ECR Registry   : $ECR_REGISTRY"
          echo "ECR Repository : $ECR_REPOSITORY"
          echo "AWS Region     : $AWS_REGION"

# =======================================================================================
# 2. Main CI/CD Pipeline
# =======================================================================================

  CI-Job:
    name: Frontend CI/CD
    needs: Set-Variables-Job

    uses: ./.github/workflows/_node-build.yml
    with:
      # =========================================================================
      # General
      # =========================================================================

      service-name: frontend
      runner: ${{ needs.Set-Variables-Job.outputs.runner }}

      # =========================================================================
      # Application Security Scans
      # =========================================================================

      gitleaks-scan: true
      eslint-scan: true
      
      trivy-fs-scan: true
      trivy-fs-scan-path: "."
      trivy-fs-skip-files: "**/README.md,**/LICENSE,**/docs/**"
      
      codeql-scan: true
      sonarqube-scan: false
      sonar-host-url: ""

      # =========================================================================
      # Dockerfile Security Scan
      # =========================================================================

      dockerfile-scan: true
      dockerfile: Dockerfile
            
      hadolint-dockerfile-scan: true
      trivy-dockerfile-scan: true
      
      # opa-conftest-dockerfile-scan: false
      # opa-policy: "opa-policy/dockerfile/"

      # =========================================================================
      # Image Build
      # =========================================================================

      image-build: true
      build-context: "."

      image-scan: true
      image-push-ecr: true
      
      ecr-registry: ${{ needs.Set-Variables-Job.outputs.ecr-registry }}
      ecr-repository: ${{ needs.Set-Variables-Job.outputs.ecr-repository }}
      aws-region: ${{ needs.Set-Variables-Job.outputs.aws-region }}
      aws-ecr-role-arn: ${{ needs.Set-Variables-Job.outputs.aws-ecr-role-arn }}

      # =========================================================================
      # Image Signing
      # =========================================================================
      
      image-sign: false                 # Don't enable this
      
      # =========================================================================
      # SBOM
      # =========================================================================

      image-sbom: false                 # Don't enable this

      # =========================================================================
      # GitOps
      # =========================================================================
      
      update-helm-values: true
      gitops-owner: ${{ vars.GITOPS_OWNER }}
      gitops-repo: ${{ vars.GITOPS_REPO }}
      helm-values-file: envs/dev/values-frontend.yaml  

    secrets:

      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
