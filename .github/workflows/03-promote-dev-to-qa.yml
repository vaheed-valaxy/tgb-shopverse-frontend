# Triggered manually — picks up the image currently running in DEV and opens
# a PR in the GitOps repo (vars.GITOPS_REPO) to promote it to QA.
# QA ArgoCD app auto-syncs after merge.

name: Promote — Frontend - DEV - To - QA

on:
  workflow_dispatch: 

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  RUNS_ON: ubuntu-latest

jobs:   
  set-variables:
    runs-on: ubuntu-latest
    outputs:
      aws-ecr-role-arn: ${{ steps.set-variables.outputs.aws-ecr-role-arn }}
      runs-on: ${{ steps.set-variables.outputs.runs-on }}
    steps:
      - name: Set Variables
        id: set-variables
        env: 
          AWS_ECR_ROLE_ARN: ${{ env.RUNS_ON == 'ubuntu-latest' && vars.AWS_ECR_ROLE_ARN || '' }}
        run: |
          echo "aws-ecr-role-arn=$AWS_ECR_ROLE_ARN" >> "$GITHUB_OUTPUT"
          echo "runs-on=$RUNS_ON" >> "$GITHUB_OUTPUT"

  promote-dev-to-qa:
    needs: set-variables
    uses: vaheed-valaxy/central-github-actions/.github/workflows/reusable-promote-dev-to-qa.yml@main
    with:
      service-name: frontend
      runner: ${{ needs.set-variables.outputs.runs-on }}
      
      dev-values-file: envs/dev/values-frontend.yaml
      qa-values-file: envs/qa/values-frontend.yaml
      
      gitops-repo: shopverse-gitops
      gitops-owner: vaheed-valaxy
      
      dev-ecr-repo: shopverse-dev/frontend
      qa-ecr-repo: shopverse-qa/frontend
      
      aws-region: us-east-1
      aws-ecr-qa-promotion-role-arn: ${{ needs.set-variables.outputs.aws-ecr-role-arn }} # arn:aws:iam::123456789012:role/shopverse-qa-promotion
  
    secrets:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
