name: Docker Build Test

on:
  workflow_dispatch:
  
permissions:
  contents: read
  # id-token: write
  
jobs:
  docker-build:
    runs-on: ubuntu-latest
    env:
      AWS_ACCOUNT_ID: "254405569649"
      AWS_REGION: us-east-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify runner
        run: |
          echo "uname"
          uname -a

          echo "Docker Version"
          docker version

          echo "Docker Info"
          docker info

          echo "Docker BUildx Version"
          docker buildx version
          
          
      
