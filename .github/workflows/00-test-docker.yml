name: Docker Build Test

on:
  workflow_dispatch:
  
permissions:
  contents: read
  id-token: write
  
jobs:
  docker-build:
    runs-on: ubuntu-latest
    env:
      AWS_ACCOUNT_ID: "254405569649"
      AWS_REGION: us-east-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify runner
        run: |
          echo "uname"
          uname -a

          echo "Docker Version"
          docker version

          echo "Docker Info"
          docker info

          echo "Docker BUildx Version"
          docker buildx version

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity 

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Some Debug
        run: |
          IMAGE="254405569649.dkr.ecr.us-east-1.amazonaws.com/shopverse-dev/frontend"
          TAG="sha-fae0054"

          echo "========== IMAGE INDEX =========="

          docker buildx imagetools inspect "${IMAGE}:${TAG}"
          
          echo "========== IMAGE INDEX RAW JSON =========="
          
          docker buildx imagetools inspect "${IMAGE}:${TAG}" --raw | jq .

          docker image inspect "$IMAGE_WITH_TAG" \
            --format 'OS={{.Os}} ARCH={{.Architecture}} ID={{.Id}}'
          
          
      
